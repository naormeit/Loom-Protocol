[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loom-protocol"
version = "1.0.0"
description = "Agent Transfer Protocol (ATP) middleware for secure agentic transactions"
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
azure = [
    "azure-ai-contentsafety",
    "azure-identity",
    "azure-cosmos",
    "openai"
]
# MCP server for agent integrations (the MCP SDK needs Python 3.10+).
mcp = [
    "mcp>=1.2,<2; python_version >= '3.10'"
]

[project.scripts]
loom-api = "core.api.server:main"

[tool.setuptools.packages.find]
where = [".", "sdk/python"]
include = ["core*", "loom_protocol*"]
exclude = ["tests*", "examples*", "docs*"]
